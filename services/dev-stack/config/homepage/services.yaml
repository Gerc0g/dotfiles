# Tiles use pretty `.test` names (need the /etc/hosts line on the client; from
# other devices use the sslip.io names instead). Live status/stats come from
# docker (server: my-docker, container: dev-*).
# NOTE: Loki, Tempo, Ollama are backend APIs with NO web UI — Loki/Tempo are
# viewed inside Grafana (Explore); Ollama answers on /api/*. Their tiles point
# where you actually use them.
- Core:
    - Postgres:
        icon: postgres.png
        description: gerc0g:5432 · dev/dev · (DB — open in CloudBeaver)
        href: http://cloudbeaver.test
        server: my-docker
        container: dev-postgres
