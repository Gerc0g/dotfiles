# Codex-профиль зоны обучения: `codex -p research`.
#
# Накладывается поверх ~/.codex/config.toml, поэтому здесь только отличия.
# Смысл слоя — убрать из промпта инструменты, которые в конспектировании не
# используются: каждый плагин везёт описания своих скиллов в каждый запрос.
#
# Что осознанно оставлено включённым в базовом конфиге:
#   pdf       — читать оригиналы из raw/ при уточнении формулы;
#   documents — разбирать .docx-материалы, если такие появятся.

[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."github@openai-curated"]
enabled = false
